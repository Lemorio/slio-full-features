name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 || true
          sudo docker image prune -a -f || true
          sudo apt-get clean || true
          echo "After cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (afat / arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon

      - name: Free space before upload (drop caches, keep only APK)
        if: always()
        run: |
          df -h /
          rm -rf ~/.gradle/caches TMessagesProj_App/build/intermediates || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slio-afat-debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: warn

  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 || true
          sudo docker image prune -a -f || true
          sudo apt-get clean || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (afat / arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slio-afat-release-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: warn
